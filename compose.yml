services:

  groupoffice:
    image: intermesh/groupoffice:26.0
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - "db"
    volumes:
      - godata:/var/lib/groupoffice:delegated
      - goetc:/etc/groupoffice/multi_instance:delegated
    env_file:
      - ./db.env
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
        # Fixed so the mailserver can allow it in GROUPOFFICE_NETS
        ipv4_address: 172.28.0.10

  db:
    image: mariadb:10.11
    restart: always
#    ports:
#      - "8306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: groupoffice
      MARIADB_AUTO_UPGRADE: 1
    env_file:
      - ./db.env
    volumes:
      - dbdata:/var/lib/mysql:delegated
      - ~/Downloads:/root/Downloads:delegated # Useful for importing large dump files

  mailserver:
#    image: intermesh/groupoffice-mailserver:latest
    ## When using local builds for testing:
    build:
       context: ./

    depends_on:
      - "db"
    restart: always
#    ports:
#      - "143:143"
#      - "4190:4190"
#      - "25:25"
#      - "587:587"
    env_file:
      - ./db.env
    environment:
      # For development / testing only
      DOVECOT_AUTH_ALLOW_CLEAR_TEXT: yes
      MAIL_HOSTNAME: mailserver.localdomain
      # The fixed IP of the groupoffice service
      GROUPOFFICE_NETS: 172.28.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  godata:
  goetc:
  dbdata:
  vmail:
